#cloud-config
# admiral-max — customer box (Hetzner Cloud, Debian 13, labels: customer=admiral-max role=app env=prod)
#
# Works unchanged on x86 (CX) and ARM (CAX). Paste into "Cloud config" when creating the server.
#
# Edit before use:      DOMAIN in /etc/box.env below (the site's hostname; DNS A/AAAA must point at the box
#                       before first boot or Caddy retries TLS until it does — harmless).
# Never in this file:   Telegram token. After boot, scp the VPS's /etc/telegram.env to the box (0600);
#                       the box then announces itself and box-alert starts working. Nothing else to do by hand.
#
# What you get: root key-only SSH · nftables default-drop (22/80/443) · unattended security upgrades with a
# 04:30 reboot window · 2G swap · Caddy (auto-TLS) serving the static site from the GitHub repo · Docker for the
# reservation backend (compose at /srv/app, proxied by Caddy under /api/) · daily site pull · Telegram alerts.

hostname: admiral-max
timezone: Europe/Zagreb
locale: C.UTF-8

ssh_authorized_keys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDmhydhH8ltHpqTLxT+k/TaZaxejj3U1OHSG7ETjT1nH j@j

ssh_pwauth: false
disable_root: false

package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - git
  - gnupg
  - nftables
  - unattended-upgrades
  - caddy
  - jq
  - vim-tiny

swap:
  filename: /swapfile
  size: 2G
  maxsize: 2G

write_files:
  # ---- box identity: the only thing to edit per customer -------------------------------------------
  - path: /etc/box.env
    permissions: "0644"
    content: |
      CUSTOMER=admiral-max
      DOMAIN=admiral-max.example        # CHANGE ME — e.g. admiralmax.hr
      SITE_REPO=https://github.com/Josip-Stojanovic/admiral-max.git
      SITE_DIR=/srv/www/admiral-max

  # ---- SSH: key-only root, no passwords, nothing else ------------------------------------------------
  - path: /etc/ssh/sshd_config.d/10-box.conf
    permissions: "0644"
    content: |
      PermitRootLogin prohibit-password
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      X11Forwarding no

  # ---- firewall: default-drop, same idiom as the VPS (add/delete table, iifname, no flush ruleset so
  #      Docker's own tables survive a reload) -------------------------------------------------------------
  - path: /etc/nftables.conf
    permissions: "0755"
    content: |
      #!/usr/sbin/nft -f
      add table inet filter
      delete table inet filter
      table inet filter {
        chain input {
          type filter hook input priority 0; policy drop;
          iifname "lo" accept
          ct state established,related accept
          ct state invalid drop
          ip protocol icmp accept
          ip6 nexthdr icmpv6 accept
          tcp dport { 22, 80, 443 } accept
          udp dport 443 accept   # HTTP/3
        }
        chain forward {
          type filter hook forward priority 0; policy accept;   # Docker manages its own forward rules
        }
        chain output {
          type filter hook output priority 0; policy accept;
        }
      }

  # ---- unattended security upgrades, reboot in the closed hours if a kernel needs it ------------------
  - path: /etc/apt/apt.conf.d/52box-unattended
    permissions: "0644"
    content: |
      Unattended-Upgrade::Origins-Pattern { "origin=Debian,codename=${distro_codename},label=Debian-Security"; "origin=Debian,codename=${distro_codename}-security,label=Debian-Security"; "origin=Docker"; };
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:30";
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

  # ---- Caddy: static site now, /api/ to the backend when it exists ------------------------------------
  - path: /etc/caddy/Caddyfile
    permissions: "0644"
    content: |
      {
        email hostmaster@stojanovic.cv
      }

      import /etc/caddy/site.caddy

  - path: /etc/caddy/site.caddy.tmpl
    permissions: "0644"
    content: |
      @DOMAIN@, www.@DOMAIN@ {
        encode zstd gzip
        root * @SITE_DIR@
        file_server

        # reservation backend — uncomment when /srv/app is running
        # handle /api/* {
        #   reverse_proxy 127.0.0.1:8080
        # }

        header {
          Strict-Transport-Security "max-age=31536000"
          X-Content-Type-Options nosniff
          Referrer-Policy strict-origin-when-cross-origin
          -Server
        }
        log {
          output file /var/log/caddy/access.log { roll_keep 7 }
        }
      }

  # ---- site: clone once, pull daily (the repo commits its built output, nothing to build here) ----------
  - path: /usr/local/sbin/site-pull
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      . /etc/box.env
      if [ ! -d "$SITE_DIR/.git" ]; then
        git clone --depth 1 "$SITE_REPO" "$SITE_DIR"
      else
        git -C "$SITE_DIR" pull --ff-only -q
      fi
      chown -R caddy:caddy "$SITE_DIR"

  - path: /etc/systemd/system/site-pull.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Pull the static site from GitHub
      After=network-online.target
      Wants=network-online.target
      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/site-pull

  - path: /etc/systemd/system/site-pull.timer
    permissions: "0644"
    content: |
      [Unit]
      Description=Daily site pull
      [Timer]
      OnCalendar=*-*-* 05:00:00
      RandomizedDelaySec=10m
      Persistent=true
      [Install]
      WantedBy=timers.target

  # ---- Telegram: same bot/chat as the cluster; creds arrive later as /etc/telegram.env (0600) ---------
  - path: /usr/local/sbin/tg-send
    permissions: "0755"
    content: |
      #!/bin/bash
      # usage: tg-send "text"   (silent no-op until /etc/telegram.env exists)
      [ -r /etc/telegram.env ] || exit 0
      . /etc/telegram.env
      curl -fsS -m 10 -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
        --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=$1" || true

  - path: /usr/local/sbin/box-alert
    permissions: "0755"
    content: |
      #!/bin/bash
      # Transition-based resource/TLS alerts, VPS idiom. Runs every 15 min; --daily posts a summary.
      set -u
      . /etc/box.env
      STATE=/var/lib/box-alert; mkdir -p "$STATE"
      H=$(hostname)
      mem_avail=$(awk '/MemAvailable/{print int($2/1024)}' /proc/meminfo)
      disk=$(df --output=pcent / | tail -1 | tr -dc 0-9)
      load=$(cut -d' ' -f2 /proc/loadavg)
      cores=$(nproc)
      cert_days=""
      exp=$(echo | timeout 10 openssl s_client -servername "$DOMAIN" -connect 127.0.0.1:443 2>/dev/null | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
      [ -n "$exp" ] && cert_days=$(( ( $(date -d "$exp" +%s) - $(date +%s) ) / 86400 ))
      if [ "${1:-}" = "--daily" ]; then
        tg-send "📦 $H daily · up $(uptime -p | sed 's/up //') · load $load/$cores · mem free ${mem_avail}M · disk ${disk}% · cert ${cert_days:-?}d · docker $(docker ps -q 2>/dev/null | wc -l) up"
        exit 0
      fi
      check() { # name condition message
        local f="$STATE/$1"
        if [ "$2" = 1 ]; then [ -e "$f" ] || { touch "$f"; tg-send "🚨 $H: $3"; }
        else [ -e "$f" ] && { rm -f "$f"; tg-send "✅ $H: $1 recovered"; }; fi
      }
      check mem  $([ "$mem_avail" -lt 300 ] && echo 1 || echo 0)  "RAM low: ${mem_avail}M available"
      check disk $([ "$disk" -ge 85 ] && echo 1 || echo 0)         "disk ${disk}% full"
      check load $(awk -v l="$load" -v c="$cores" 'BEGIN{print (l>=0.9*c)?1:0}') "load $load on $cores cores"
      check cert $([ -n "$cert_days" ] && [ "$cert_days" -lt 14 ] && echo 1 || echo 0) "TLS cert for $DOMAIN expires in ${cert_days}d"
      check caddy $(systemctl is-active -q caddy && echo 0 || echo 1) "caddy is not running"

  - path: /etc/systemd/system/box-alert.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Box resource/TLS alerts to Telegram
      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/box-alert

  - path: /etc/systemd/system/box-alert.timer
    permissions: "0644"
    content: |
      [Unit]
      Description=Box alerts every 15 min
      [Timer]
      OnBootSec=5m
      OnUnitActiveSec=15m
      Persistent=true
      [Install]
      WantedBy=timers.target

  - path: /etc/systemd/system/box-daily.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Daily box summary to Telegram
      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/box-alert --daily

  - path: /etc/systemd/system/box-daily.timer
    permissions: "0644"
    content: |
      [Unit]
      Description=Daily box summary 18:00
      [Timer]
      OnCalendar=*-*-* 18:00:00 Europe/Zagreb
      Persistent=true
      [Install]
      WantedBy=timers.target

  - path: /etc/systemd/system/box-hello.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Announce boot to Telegram
      After=network-online.target
      Wants=network-online.target
      [Service]
      Type=oneshot
      ExecStart=/bin/bash -c '/usr/local/sbin/tg-send "🟢 $(hostname) booted · $(hostname -I | cut -d" " -f1) · kernel $(uname -r)"'
      [Install]
      WantedBy=multi-user.target

  # ---- backend placeholder: the reservation stack lands here, bound to localhost only -----------------
  - path: /srv/app/compose.yaml
    permissions: "0644"
    content: |
      # Reservation backend + Telegram bot. Everything binds 127.0.0.1; Caddy is the only public face.
      # services:
      #   api:
      #     image: ghcr.io/josip-stojanovic/reservations:latest
      #     restart: unless-stopped
      #     env_file: .env
      #     ports: ["127.0.0.1:8080:8080"]
      #     depends_on: [db]
      #   db:
      #     image: postgres:17-alpine
      #     restart: unless-stopped
      #     env_file: .env
      #     volumes: [pgdata:/var/lib/postgresql/data]
      # volumes:
      #   pgdata:

  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      { "log-driver": "json-file", "log-opts": { "max-size": "10m", "max-file": "3" } }

runcmd:
  # Docker CE from Docker's repo (amd64 and arm64 alike)
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
  - bash -c '. /etc/os-release; echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian $VERSION_CODENAME stable" > /etc/apt/sources.list.d/docker.list'
  - apt-get update -q
  - apt-get install -y -q docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - systemctl enable --now docker
  # firewall
  - systemctl enable --now nftables
  - nft -f /etc/nftables.conf
  # Caddy site config from the template + /etc/box.env
  - bash -c '. /etc/box.env; sed -e "s#@DOMAIN@#$DOMAIN#g" -e "s#@SITE_DIR@#$SITE_DIR#g" /etc/caddy/site.caddy.tmpl > /etc/caddy/site.caddy'
  - mkdir -p /var/log/caddy && chown caddy:caddy /var/log/caddy
  # site
  - /usr/local/sbin/site-pull
  - systemctl restart caddy
  - systemctl enable --now site-pull.timer box-alert.timer box-daily.timer box-hello.service
  # ssh hardening takes effect
  - systemctl restart ssh
  # sysctl: mild
  - bash -c 'printf "vm.swappiness=10\n" > /etc/sysctl.d/90-box.conf && sysctl -q -p /etc/sysctl.d/90-box.conf'

final_message: "admiral-max box ready after $UPTIME s. Next: scp /etc/telegram.env from the VPS, point DNS, edit /etc/box.env if the domain changed and re-run the sed + systemctl restart caddy."
