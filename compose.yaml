# The whole runtime of the box. Deployed by box/deploy (git pull + docker compose up -d).
# Caddy is the only service that publishes ports. Everything else stays on the internal network.

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy

